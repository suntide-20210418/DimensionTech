plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.147'
    id 'idea'
    id 'com.diffplug.spotless' version '8.0.0'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// The vanilla loot-corpus gate must not inherit enchantments or loot hooks from optional
// development mods. Invoke it with -PvanillaLootRuntime=true.
def vanillaLootRuntime = providers.gradleProperty('vanillaLootRuntime')
        .map { it.toBoolean() }
        .getOrElse(false)

// Data generation must run with only the project and NeoForge on the runtime classpath. Optional
// mods can pollute the generated output, and at least one of them (KubeJS) owns a non-daemon thread
// that keeps the data-generation JVM alive after the providers finish. Keep them available for
// client/game-test runs.
//
// This switch only covers Gradle-launched runs: an IDE "runData" run configuration is of type
// Application, so it starts the module classpath directly and always sees the optional mods.
// DatagenExitWatchdog covers that case from inside the process.
def dataGenerationRun = gradle.startParameter.taskNames.any {
    it == 'runData'
            || it.endsWith(':runData')
            || it == 'prepareRunData'
            || it.endsWith(':prepareRunData')
            || it == 'prepareRunDataCompile'
            || it.endsWith(':prepareRunDataCompile')
}
def optionalModConfiguration = (vanillaLootRuntime || dataGenerationRun)
        ? 'compileOnly'
        : 'implementation'

sourceSets.main.resources {
    srcDir('src/generated/resources')

    exclude("**/*.bbmodel")
    // The data generator's hash cache lives at the root of the generated source set. Pattern is
    // relative to the source dir root, so it must not carry the src/generated prefix.
    exclude(".cache/**")
}

repositories {
    exclusiveContent {
        forRepository {
            maven {
                url "https://cursemaven.com"
            }
        }
        filter {
            includeGroup "curse.maven"
        }
    }
    maven {
        url "https://api.modrinth.com/maven"
        content { includeGroup "maven.modrinth" }
    }
    maven {
        url 'https://maven.blamejared.com'
    }
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            gameDirectory = project.file('run/client')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            gameDirectory = project.file('run/server')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            // Game tests instantiate the vanilla "empty" template, so the minecraft namespace has
            // to stay enabled alongside the mod's own.
            systemProperty 'neoforge.enabledGameTestNamespaces', "${mod_id},minecraft"
            systemProperty 'dimension_tech.vanilla_loot_runtime', vanillaLootRuntime.toString()
            gameDirectory = project.file(vanillaLootRuntime
                    ? 'run/vanilla-loot-gametest'
                    : 'run/gametest')
        }

        data {
            data()
            gameDirectory = project.file('run/data')
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // KubeJS and its scripting bridge. Both are optional at runtime; classes are only loaded
    // through kubejs.plugins.txt when KubeJS is present.
    add(optionalModConfiguration, "curse.maven:kubejs-238086:${kubejs_version}")
    add(optionalModConfiguration, "curse.maven:rhino-416294:${rhino_version}")

    add(optionalModConfiguration, "curse.maven:jade-324717:${jade_version}")
    add(optionalModConfiguration, "curse.maven:applied-energistics-2-223794:${ae2_version}")
    add(optionalModConfiguration, "curse.maven:allthemodium-364466:${allthemodium_version}")
    add(optionalModConfiguration, "curse.maven:jei-238222:${jei_version}")

    // Mouse Tweaks is a client-only convenience mod. Keeping it off the dev runtime prevents
    // runData/server launches from constructing it.
    compileOnly "curse.maven:mouse-tweaks-60089:${mouse_tweaks_version}"
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.register('syncGameTestStructures', Sync) {
    from 'src/test/resources/gameteststructures'
    into(vanillaLootRuntime
            ? 'run/vanilla-loot-gametest/gameteststructures'
            : 'run/gametest/gameteststructures')
}

tasks.matching { it.name == 'prepareRunGameTestServer' }.configureEach {
    dependsOn tasks.named('syncGameTestStructures')
}

spotless {
    // Eclipse formatter is deliberately disabled so no XML config is looked up.
    enforceCheck = false

    java {
        target 'src/main/java/**/*.java'
        googleJavaFormat().aosp().reflowLongStrings()
        removeUnusedImports()
        endWithNewline()
    }

    format 'gradle', {
        target '*.gradle'
        trimTrailingWhitespace()
        leadingTabsToSpaces(4)
        endWithNewline()
    }

    format 'misc', {
        target '**/*.md', '.gitignore'
        trimTrailingWhitespace()
        endWithNewline()
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
