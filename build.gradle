plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
    id 'com.diffplug.spotless' version "8.0.0"
}

group = mod_group_id
version = mod_version

// The vanilla loot-corpus gate must not inherit enchantments or loot hooks from
// optional development mods. Invoke it with -PvanillaLootRuntime=true.
def vanillaLootRuntime = providers.gradleProperty('vanillaLootRuntime')
        .map { it.toBoolean() }
        .getOrElse(false)
def optionalModConfiguration = vanillaLootRuntime ? 'compileOnly' : 'implementation'

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    withSourcesJar()
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', file("${buildDir}/createSrgToMcp/output.srg").absolutePath

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
            workingDirectory project.file('run/client')
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            workingDirectory project.file('run/server')
            args '--nogui'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', "${mod_id},minecraft"
            property 'dimension_tech.vanilla_loot_runtime', vanillaLootRuntime.toString()
            workingDirectory project.file(vanillaLootRuntime
                    ? 'run/vanilla-loot-gametest'
                    : 'run/gametest')
        }

        data {
            workingDirectory project.file('run/data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

spotless {
    // 明确禁用Eclipse格式化器以避免寻找XML配置文件
    enforceCheck = false

    java {
        target 'src/main/java/**/*.java'
        googleJavaFormat().aosp().reflowLongStrings()
        removeUnusedImports()
        endWithNewline()
    }

    // 完全替换原来的 groovyGradle 配置
    format 'gradle', {
        target '*.gradle'
        trimTrailingWhitespace()
        leadingTabsToSpaces(4)
        endWithNewline()
    }

    format 'misc', {
        target '**/*.md', '.gitignore'
        trimTrailingWhitespace()
        endWithNewline()
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    mavenLocal()
    maven { url 'https://maven.aliyun.com/repository/public' }
    maven {
        url = 'https://bmclapi2.bangbang93.com/maven'
        content { includeGroup "net.minecraftforge" }
    }
    maven {
        url "https://cursemaven.com"
        content { includeGroup "curse.maven" }
    }
    maven {
        url "https://api.modrinth.com/maven"
        content { includeGroup "maven.modrinth" }
    }
    maven {
        url 'https://maven.blamejared.com'
    }
    maven {
        name = 'ParchmentMC'
        url = 'https://maven.parchmentmc.org'
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // Optional at runtime; classes are only loaded through kubejs.plugins.txt when KubeJS is present.
    add(optionalModConfiguration, fg.deobf("curse.maven:kubejs-238086:8020595"))
    // KubeJS exposes its scripting bridge through the optional Rhino runtime.
    // Keep this compile-only so Dimension Tech remains independent at runtime.


    add(optionalModConfiguration, fg.deobf("curse.maven:jade-324717:6855440"))
    add(optionalModConfiguration, fg.deobf("curse.maven:guideme-1173950:7127447"))
    add(optionalModConfiguration, fg.deobf("curse.maven:applied-energistics-2-223794:7148487"))
    add(optionalModConfiguration, fg.deobf("curse.maven:mekanism-268560:6552911"))
    add(optionalModConfiguration, fg.deobf("curse.maven:architectury-api-419699:5137938"))
    add(optionalModConfiguration, fg.deobf("curse.maven:rhino-416294:6186971"))

    // Mouse Tweaks is a client-only convenience mod. Keeping it off the
    // dev runtime prevents runData/server launches from constructing it.
    compileOnly fg.deobf("curse.maven:mouse-tweaks-60089:5338457")
    add(optionalModConfiguration, fg.deobf("curse.maven:allthemodium-364466:7142820"))
    add(optionalModConfiguration, fg.deobf("curse.maven:geckolib-388172:8285794"))
    add(optionalModConfiguration, fg.deobf("curse.maven:ato-405593:5348605"))
    add(optionalModConfiguration, fg.deobf("curse.maven:time-in-a-bottle-895919:4744787"))

    add(optionalModConfiguration, fg.deobf("curse.maven:jei-238222:7391695"))
    compileOnly fg.deobf("curse.maven:emi-580555:6420945")

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

tasks.register('syncGameTestStructures', Sync) {
    from 'src/test/resources/gameteststructures'
    into(vanillaLootRuntime
            ? 'run/vanilla-loot-gametest/gameteststructures'
            : 'run/gametest/gameteststructures')
}

tasks.matching { it.name == 'prepareRunGameTestServer' }.configureEach {
    dependsOn tasks.named('syncGameTestStructures')
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [minecraft_version   : minecraft_version, minecraft_version_range: minecraft_version_range,
                             forge_version       : forge_version, forge_version_range: forge_version_range,
                             loader_version_range: loader_version_range,
                             mod_id              : mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
                             mod_authors         : mod_authors, mod_description: mod_description,]

    inputs.properties replaceProperties

    filesMatching([
            'META-INF/mods.toml',
            'pack.mcmeta'
    ]) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes(["Specification-Title"     : mod_id,
                    "Specification-Vendor"    : mod_authors,
                    "Specification-Version"   : "1", // We are version 1 of ourselves
                    "Implementation-Title"    : project.name,
                    "Implementation-Version"  : project.jar.archiveVersion,
                    "Implementation-Vendor"   : mod_authors,
                    "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")])
    }

    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
