modLoader="javafml" #mandatory

loaderVersion="${loader_version_range}" #mandatory

license="${mod_license}"

#issueTrackerURL="https://change.me.to.your.issue.tracker.example.invalid/" #optional

[[mods]] #mandatory

modId="${mod_id}" #mandatory

version="${mod_version}" #mandatory

displayName="${mod_name}" #mandatory

#updateJSONURL="https://change.me.example.invalid/updates.json" #optional

#displayURL="https://change.me.to.your.mods.homepage.example.invalid/" #optional

#logoFile="examplemod.png" #optional

#credits="" #optional

authors="suntide_20210418"

description='''
This is a mod for strcture processing.
'''

#[[mixins]]
#config="${mod_id}.mixins.json"

#[[accessTransformers]]
#file="META-INF/accesstransformer.cfg"

[[dependencies.${mod_id}]] #optional
    modId="neoforge" #mandatory
    type="required" #mandatory
    versionRange="[${neo_version},)" #mandatory
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required" #mandatory
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Optional integrations. Dimension Tech stays loadable without any of them; the integration classes
# are only reached when the corresponding mod is present.

[[dependencies.${mod_id}]]
    modId="ae2"
    type="optional"
    versionRange="[19.2.17,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="jade"
    type="optional"
    versionRange="[15.10.6,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="jei"
    type="optional"
    # AbstractRecipeCategory and the recipe-extras text widget are both used by the category
    # renderers, and 19.25.0.322 is the floor KubeJS itself pins for 1.21.1.
    versionRange="[19.25.0.322,)"
    ordering="AFTER"
    side="BOTH"

#[[dependencies.${mod_id}]]
    # KubeJS is reached exclusively through kubejs.plugins.txt, so it is deliberately left
    # undeclared here: declaring it would make the loader order the two mods against each other for
    # a bridge that is entirely optional at runtime.

#[features.${mod_id}]
#openGLVersion="[3.2,)"