# 持续集成：编译 -> 打包 -> 校验产物
#
# 触发条件：
#   - 任意分支的 push
#   - 任意 pull request
#   - 手动 workflow_dispatch
#
# 注意这里只匹配分支，不匹配标签：版本标签的构建与发布由 release.yml 负责，
# 这样 "打标签" 这一个动作不会同时跑两条流水线。
#
# 关于构建本身（见 build.gradle）：
#   * `build` 的任务图是 compileJava -> jar -> reobfJar -> sourcesJar -> test -> check，
#     其中 reobfJar 是 jar 的 finalizer，会把混淆过的 jar 原地写回 build/libs。
#   * spotless 的 enforceCheck = false，所以 `check` 不会包含 spotlessCheck，
#     格式化差异不会卡住 CI（本仓的 aosp 100 列配置本身也不适合当门禁）。
#   * 可选依赖（KubeJS / AE2 / Mekanism 等）走 `implementation`，ForgeGradle 必须
#     把它们全部反混淆，冷缓存下这一步最耗时，所以 setup-gradle 的缓存很关键。

name: Build

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

# 同一引用上只保留最新一次构建，旧的自动取消。
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Compile & package
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        # 该 action 默认会：
        #   1. 缓存 Gradle User Home 的 caches（含 ForgeGradle 的 forge_gradle
        #      与反混淆依赖）和 wrapper 发行版；
        #   2. 自动校验 gradle-wrapper.jar 是否为 Gradle 官方发行的校验和。
        # 本仓的 wrapper jar 来自 Gradle 8.1.1 官方发行（gradle-wrapper.properties
        # 里声明的发行版是 8.8），属于已知官方校验和，校验可以通过。

      - name: Build
        run: ./gradlew build --stacktrace

      - name: Verify packaged jar
        run: |
          set -euo pipefail
          version=$(sed -n 's/^mod_version=//p' gradle.properties)
          shopt -s nullglob
          main=''
          for f in build/libs/*.jar; do
            case "$f" in *-sources.jar) continue ;; esac
            main="$f"
            break
          done
          if [ -z "$main" ]; then
            echo "::error::build/libs 下没有找到主 jar"
            exit 1
          fi
          echo "mod_version : $version"
          echo "主产物      : $main"
          ls -l build/libs

          unzip -l "$main" > jar-entries.txt
          grep -q 'META-INF/mods.toml' jar-entries.txt
          grep -q 'com/suntide_20210418/dimensiontech/' jar-entries.txt
          unzip -p "$main" META-INF/mods.toml > mods.toml.extracted
          grep -Fq "version=\"${version}\"" mods.toml.extracted
          echo "jar 内的 mods.toml 版本与 gradle.properties 一致"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dimension_tech-build
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
